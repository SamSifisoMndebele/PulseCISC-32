<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient for Silicon Chip Substrate -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#03060c" />
    </linearGradient>

    <!-- Outer Chip Border Gradient: Electric Cyan to Neon Purple -->
    <linearGradient id="chipBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pulse Waveform Gradient: Cyberpunk Cyan through Indigo to Fuchsia -->
    <linearGradient id="pulseWave" x1="14" y1="32" x2="50" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <!-- Pin Gradients -->
    <linearGradient id="pinCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pinPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="dieCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 16 Bus Pins (32-Bit Dual-Bus Identity: 4 per side) -->
  <g stroke-linecap="round" stroke-width="2.4">
    <!-- Top Pins (Clock & Control / Cyan) -->
    <path d="M20 5v7M28 5v7M36 5v7M44 5v7" stroke="url(#pinCyan)" />
    <!-- Bottom Pins (Data Bus / Violet) -->
    <path d="M20 52v7M28 52v7M36 52v7M44 52v7" stroke="url(#pinPurple)" />
    <!-- Left Pins (Address Lines / Cyan) -->
    <path d="M5 20h7M5 28h7M5 36h7M5 44h7" stroke="url(#pinCyan)" />
    <!-- Right Pins (Status & Execution / Violet) -->
    <path d="M52 20h7M52 28h7M52 36h7M52 44h7" stroke="url(#pinPurple)" />
  </g>

  <!-- Main Chip Package Base -->
  <rect
    x="12"
    y="12"
    width="40"
    height="40"
    rx="9"
    fill="url(#chipBg)"
    stroke="url(#chipBorder)"
    stroke-width="1.8"
  />

  <!-- Silicon Die Window -->
  <rect
    x="19"
    y="19"
    width="26"
    height="26"
    rx="5"
    fill="#050813"
    stroke="#38bdf8"
    stroke-opacity="0.25"
    stroke-width="1"
  />

  <!-- Central Wafer Core Glow -->
  <rect
    x="19"
    y="19"
    width="26"
    height="26"
    rx="5"
    fill="url(#dieCoreGlow)"
  />

  <!-- Micro-Architecture Circuit Traces & Alignment Markers -->
  <g stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round">
    <path d="M19 25h3M19 39h3M42 25h3M42 39h3" />
    <path d="M25 19v3M39 19v3M25 42v3M39 42v3" />
  </g>
  <circle cx="23" cy="23" r="0.9" fill="#38bdf8" opacity="0.6" />
  <circle cx="41" cy="23" r="0.9" fill="#c084fc" opacity="0.6" />
  <circle cx="23" cy="41" r="0.9" fill="#38bdf8" opacity="0.6" />
  <circle cx="41" cy="41" r="0.9" fill="#c084fc" opacity="0.6" />

  <!-- === PULSE WAVEFORM (Dynamic Multi-Cycle Clock Signal) === -->
  <!-- Layer 1: Ambient Neon Glow Aura -->
  <path
    d="M14 32h8l4-13 6 26 5-19 4 6h9"
    fill="none"
    stroke="#00f0ff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.28"
  />

  <!-- Layer 2: Main Gradient Pulse Line -->
  <path
    d="M14 32h8l4-13 6 26 5-19 4 6h9"
    fill="none"
    stroke="url(#pulseWave)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Layer 3: Ultra-Crisp White Hot Core Beam -->
  <path
    d="M14 32h8l4-13 6 26 5-19 4 6h9"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Apex Clock Impulse Sparks -->
  <!-- Positive Peak (Cyan Flash) -->
  <circle cx="26" cy="19" r="3.6" fill="#00f0ff" opacity="0.4" />
  <circle cx="26" cy="19" r="2" fill="#ffffff" />

  <!-- Negative Trough (Purple Spark) -->
  <circle cx="32" cy="45" r="3.2" fill="#a855f7" opacity="0.4" />
  <circle cx="32" cy="45" r="1.6" fill="#f5d0fe" />
</svg>