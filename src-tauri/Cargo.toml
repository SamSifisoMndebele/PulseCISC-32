[package]
name = "pulsecisc-32-desktop"
version = "1.0.0"
description = "PulseCISC-32 Native Desktop CPU Simulator & Assembly IDE (Rust Core + Tauri)"
authors = ["PulseCISC-32"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
